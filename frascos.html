<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#121212">
<meta name="description" content="Arpeggio, perfumería en Santo Domingo: escoge el frasco para tu perfume y pídelo por WhatsApp.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="iconos/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arpeggio">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Frascos · Arpeggio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600;900&display=swap">
<link rel="stylesheet" href="estilo.css?v=40">
<style>
.crumbs{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:18px 0 12px}
.crumbs a{text-decoration:none}.crumbs a:hover{color:var(--ink)}
.head{background:var(--tint);border:1px solid var(--line);padding:34px 36px;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.head h1{font-family:var(--display);font-weight:500;font-size:60px;line-height:1;margin:0}
.head p{margin:8px 0 0;color:var(--muted);max-width:52ch}


.chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 6px}
.chip{all:unset;cursor:pointer;border:1px solid var(--line);padding:7px 13px;font-size:13px;color:var(--muted)}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.count{font-size:13px;color:var(--muted);margin:10px 0 0}

.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:18px}
.grid .card{padding:22px 16px 18px}
.empty{padding:50px 20px;text-align:center;color:var(--muted)}

@media (max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:700px){
  .head{padding:24px 18px}
  .head h1{font-size:42px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid .card{padding:16px 10px 14px}
  .grid .montar{font-size:11px;letter-spacing:.14em;padding:9px 4px}
  .tabs button{font-size:20px;padding:10px 12px}
  .group-h h2{font-size:28px}
}

.grid .card .ph{height:220px}
.grid .card .ph img{max-height:200px;max-width:80%}
.card .ml{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin:2px 0 14px}
.elegir{all:unset;cursor:pointer;margin-top:auto;border:1px solid var(--ink);padding:10px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;text-align:center;color:var(--ink)}
.elegir:hover,.elegir.on{background:var(--ink);color:var(--on-ink)}
.nota{margin:14px 0 0;color:var(--muted);font-size:14px}
@media (max-width:700px){.grid .card .ph{height:170px}.grid .card .ph img{max-height:155px}.elegir{font-size:11px;letter-spacing:.12em;padding:9px 4px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="crumbs"><a href="index.html">Inicio</a> / Frascos</div>
  <section class="head">
    <div>
      <p class="kick">Escoge tu frasco</p>
      <h1>Frascos</h1>
      <p>Elige el frasco en el que quieres tu perfume. Se agrega a tu pedido y nos llega junto con tus perfumes por WhatsApp.</p>
    </div>
  </section>
  <div class="chips" id="chips"></div>
  <p class="count" id="count"></p>
  <p class="nota">Un frasco por pedido. Si quieres frascos distintos para cada perfume, dínoslo en el mensaje.</p>
  <div class="grid" id="lista"></div>
</main>

<script src="datos.js?v=34"></script>
<script src="frascos.js?v=2"></script>
<script src="comun.js?v=42"></script>
<script>
montarPiezas('frascos');
const qs=new URLSearchParams(location.search);
let ml=+qs.get('ml')||0;
const tamanos=[...new Set(FRASCOS.map(f=>f[1]))].sort((a,b)=>a-b);
if(!tamanos.includes(ml))ml=0;
function pintar(){
  history.replaceState(null,'','frascos.html'+(ml?'?ml='+ml:''));
  $('#chips').innerHTML=[`<button class="chip ${!ml?'on':''}" data-ml="0">Todos</button>`,...tamanos.map(t=>`<button class="chip ${t==ml?'on':''}" data-ml="${t}">${t} ml</button>`)].join('');
  const lista=FRASCOS.filter(f=>!ml||f[1]==ml);
  $('#count').textContent=`${lista.length} frasco${lista.length==1?'':'s'}`;
  $('#lista').innerHTML=lista.map(([n,m])=>`<article class="card"><div class="ph"><img src="img/frascos/${n}.webp" alt="Frasco número ${n}, ${m} ml" loading="lazy"></div>
    <div class="nm">Frasco N.º ${n}</div><div class="ml">${m} ml</div>
    <button class="elegir" data-frasco="${n}" data-ml="${m}"></button></article>`).join('');
  pintarConcho();
}
$('#chips').onclick=e=>{const b=e.target.closest('button');if(!b)return;ml=+b.dataset.ml;pintar()};
pintar();
</script>
</body>
</html>
