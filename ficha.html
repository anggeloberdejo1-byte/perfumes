<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1a1814">
<meta name="description" content="Perfumes inspirados en Santo Domingo. Mira las fichas, agrega tus favoritos al carrito y pide por WhatsApp.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="iconos/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aroma Capital">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Ficha · Aroma Capital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="estilo.css?v=16">
<style>
.crumbs{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:18px 0 0}
.crumbs a{text-decoration:none}.crumbs a:hover{color:var(--ink)}
.label{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);font-weight:400}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.back{all:unset;cursor:pointer;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);display:inline-flex;gap:8px;align-items:center}
.back:hover{color:var(--ink)}
.pn{display:flex;align-items:center;gap:10px}
.pos{font-size:12px;letter-spacing:.12em;color:var(--muted);font-variant-numeric:tabular-nums}
.nb{all:unset;cursor:pointer;width:38px;height:38px;border:1px solid var(--line);display:grid;place-items:center;font-size:22px;line-height:1}
.nb:hover{border-color:var(--ink)}
.swipehint{margin:10px 0 0;font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.swipehint.pc{display:none}
@media (hover:hover) and (pointer:fine){.swipehint{display:none}.swipehint.pc{display:block}}
#ficha{cursor:grab}#ficha a,#ficha button{cursor:pointer}
#ficha .photo img{-webkit-user-drag:none;user-select:none}

#ficha{touch-action:pan-y}
#ficha.in-r{animation:inR .28s ease-out}#ficha.in-l{animation:inL .28s ease-out}
@keyframes inR{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
#ficha.out-up{animation:outUp .26s ease-in forwards}
@keyframes outUp{to{transform:translateY(-60px);opacity:0}}
@media (prefers-reduced-motion:reduce){#ficha.in-r,#ficha.in-l,#ficha.out-up{animation:none}}

.fhero{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:44px;align-items:center;margin-top:26px}
.photo{background:#fff;display:flex;align-items:center;justify-content:center;aspect-ratio:3/4;padding:18px}
.photo img{width:100%;height:100%;object-fit:contain}
.wordmark{font-family:var(--display);font-size:22px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin:0}
.fhero h1{font-family:var(--display);font-weight:500;font-size:60px;line-height:1;margin:6px 0 12px;text-wrap:balance}
.fhero .tags{justify-content:flex-start;margin:0 0 4px}
.desc{margin:16px 0 0;max-width:60ch;font-size:16px}

.block{margin-top:44px}
.block>.label{display:block;margin-bottom:14px;color:var(--ink)}
.acc{display:flex;flex-direction:column;max-width:460px}
.acc div{height:31px;display:flex;align-items:center;justify-content:center;font-size:14.5px;font-weight:400;border-radius:0 8px 8px 0;min-width:112px;white-space:nowrap}

.notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.notes>div{border-top:1px solid var(--ink);padding-top:10px}
.notes h4{font-family:var(--display);font-size:24px;font-weight:500;margin:0 0 6px}
.notes p{margin:0;color:var(--muted)}

.panels{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.vpanel{border:1px solid var(--line);padding:20px}
.vpanel .label{display:block;margin-bottom:14px;color:var(--ink)}
.bars{display:grid;gap:12px}
.bar{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
.bar span{font-size:14px}
.trk{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.fill{height:100%;border-radius:4px}
.src{font-size:12px;color:var(--muted);margin-top:10px}
.pending{margin-top:30px;padding:18px;border:1px dashed var(--accent-soft);color:var(--muted)}

.cta{margin-top:48px;padding:24px 26px;background:var(--ink);color:var(--on-ink);display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cta p{margin:0;font-family:var(--display);font-size:28px}
.cta .acts{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.cta .montar{border-color:var(--on-ink);color:var(--on-ink);padding:11px 18px;font-size:13px}
.cta .montar:hover,.cta .montar.on{background:var(--on-ink);color:var(--ink)}

.more{margin-top:56px}
.more h2{font-family:var(--display);font-weight:500;font-size:34px;margin:0 0 4px}
.more .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:16px}
.more .card{padding:20px 14px 16px}

@media (max-width:800px){
  .fhero{grid-template-columns:minmax(0,1fr);gap:20px}
  .photo{max-width:320px;margin:0 auto;width:100%}
  .fhero h1{font-size:44px}
  .notes{grid-template-columns:minmax(0,1fr)}
  .panels{grid-template-columns:minmax(0,1fr)}
  .more .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>
<body>
<main class="wrap">
  <div class="crumbs" id="crumbs"></div>
  <div class="sbar">
    <button class="back" id="back">↑ Volver al catálogo</button>
    <div class="pn"><button class="nb" id="prev" aria-label="Perfume anterior">‹</button><span class="pos" id="pos"></span><button class="nb" id="next" aria-label="Perfume siguiente">›</button></div>
  </div>
  <p class="swipehint">Desliza ← → para ver otro perfume · desliza ↑ sobre la foto para volver</p>
  <p class="swipehint pc">Arrastra a los lados, desliza con dos dedos en el trackpad o usa las flechas ← → para ver otro perfume</p>
  <article id="ficha"></article>
  <section class="more" id="more"></section>
</main>

<script src="datos.js?v=16"></script>
<script src="fichas.js?v=16"></script>
<script src="comun.js?v=16"></script>
<script>
const c=new URLSearchParams(location.search).get('c');
const p=BY[c];
if(!p)location.replace('catalogo.html');
const genero=p[3];
montarPiezas(genero);

// Lista para pasar al siguiente o anterior: la de la página de donde vino, o todo su género.
let lista=[],volver=cat({g:genero});
try{lista=JSON.parse(sessionStorage.getItem('ac_lista')||'[]');volver=sessionStorage.getItem('ac_volver')||volver}catch(e){}
if(!lista.includes(c))lista=PERFUMES.filter(x=>x[3]==genero).map(x=>x[0]);
const i=lista.indexOf(c);

const bars=rows=>{const max=Math.max(...rows.map(r=>r[1]));return `<div class="bars">${rows.map(([l,v,col])=>`<div class="bar"><span>${l}</span><div class="trk"><div class="fill" style="width:${Math.max(3,v/max*100)}%;background:${col}"></div></div></div>`).join('')}</div>`};
const d=FICHAS[c];
const sec=SECCIONES.find(s=>s.id==p[6]);
const gNom=genero=='H'?'Para Él':'Para Ella';
const consulta=`Hola, quiero pedir el perfume ${c}, inspirado en ${p[1]} de ${p[2]}. ¿Está disponible?`;

document.title=`${p[1]} · Aroma Capital`;
$('#crumbs').innerHTML=`<a href="index.html">Inicio</a> / <a href="${cat({g:genero})}">${gNom}</a> / <a href="${cat({g:genero,s:sec.id})}">${sec.nombre}</a> / ${esc(p[1])}`;
$('#pos').textContent=`${i+1} / ${lista.length}`;

let html=`<div class="fhero">
  <div class="photo">${img(c)||'<span class="nofoto">Foto muy pronto</span>'}</div>
  <div>
    <p class="wordmark">${esc(p[2])}</p>
    <h1>${esc(p[1])}</h1>
    <div class="tags"><span class="tag ${genero=='H'?'h':'m'}">${genero=='H'?'Hombre':'Mujer'}</span><span class="tag f">${esc(p[4])}</span><span class="tag f">${sec.nombre}</span></div>
    <p class="label" style="margin:10px 0 0">Inspirado en ${esc(p[1])} · ${esc(p[2])}</p>
    ${d&&d.desc?`<p class="desc">${esc(d.desc)}</p>`:''}
  </div>
</div>`;
if(ACORDES[c])html+=`<section class="block"><span class="label">Acordes principales</span><div class="acc">${acordes(c,99)}</div></section>`;
if(d&&d.notes){
  const n=d.notes;
  html+=`<section class="block"><span class="label">Pirámide olfativa</span><div class="notes">${n.todas
    ?`<div style="grid-column:1/-1"><h4>Notas principales</h4><p>${esc(n.todas)}</p></div>`
    :`<div><h4>Salida</h4><p>${esc(n.salida)}</p></div><div><h4>Corazón</h4><p>${esc(n.corazon)}</p></div><div><h4>Fondo</h4><p>${esc(n.fondo)}</p></div>`}</div></section>`;
}
if(d&&d.rating)html+=`<section class="block"><div class="panels"><div class="vpanel"><span class="label">Qué opina la gente</span>${bars(d.rating)}</div><div class="vpanel"><span class="label">Cuándo usarlo</span>${bars(d.when)}</div></div><p class="src">Opiniones de referencia sobre la fragancia original.</p></section>`;
if(!d)html+=`<div class="pending">Pronto agregamos la descripción y las notas de este perfume.</div>`;
html+=`<div class="cta"><p>¿Te gusta este aroma?</p><div class="acts"><button class="montar" data-code="${c}" data-off="Agregar a mi carrito" data-on="Ya está en tu carrito ✓"></button><a class="wa-btn" href="${waLink(consulta)}" target="_blank" rel="noopener">${WAICON} Consultar solo este</a></div></div>
<p class="src" style="margin-top:22px">${AVISO}</p>`;
$('#ficha').innerHTML=html;

// Recomendados: los del mismo género con los acordes del PDF más parecidos
// (se comparan nombres y largos de barra; el primer acorde pesa más).
const vec=k=>{const v={};(ACORDES[k]||[]).forEach(([l,w],j)=>v[l]=w*(j==0?1.5:1));return v};
const parecido=(a,b)=>{let d=0,na=0,nb=0;for(const l in a){na+=a[l]**2;if(b[l])d+=a[l]*b[l]}for(const l in b)nb+=b[l]**2;return na&&nb?d/Math.sqrt(na*nb):0};
const yo=vec(c);
const elegidos=PERFUMES.filter(x=>x[3]==genero&&x[0]!=c).map(x=>[x,parecido(yo,vec(x[0]))]).sort((a,b)=>b[1]-a[1]).slice(0,4).map(x=>x[0]);
const principales=(ACORDES[c]||[]).slice(0,2).map(a=>a[0].toLowerCase()).join(' y ');
if(elegidos.length)$('#more').innerHTML=`<h2>También te puede gustar</h2><p class="label">Con acordes parecidos${principales?': '+esc(principales):''}</p><div class="grid">${elegidos.map(x=>card(x[0])).join('')}</div>`;
pintarConcho();

// Entrada animada según la dirección
try{const dir=sessionStorage.getItem('ac_dir');sessionStorage.removeItem('ac_dir');if(dir)$('#ficha').classList.add(dir)}catch(e){}

// Navegación
function ir(paso){const j=(i+paso+lista.length)%lista.length;try{sessionStorage.setItem('ac_dir',paso>0?'in-r':'in-l')}catch(e){}location.replace(ficha(lista[j]))}
function salir(){const f=$('#ficha');f.classList.add('out-up');setTimeout(()=>location.href=volver,matchMedia('(prefers-reduced-motion:reduce)').matches?0:240)}
$('#prev').onclick=()=>ir(-1);$('#next').onclick=()=>ir(1);$('#back').onclick=salir;
addEventListener('keydown',e=>{if($('#drawer').classList.contains('on')||e.target.matches('input'))return;
  if(e.key=='ArrowRight')ir(1);else if(e.key=='ArrowLeft')ir(-1);else if(e.key=='Escape')salir()});

// Gestos: a los lados cambia de perfume; hacia arriba (sobre la foto o al final) vuelve al catálogo
let T=null;const F=$('#ficha');
F.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;const t=e.touches[0];
  T={x:t.clientX,y:t.clientY,t:Date.now(),foto:!!e.target.closest('.photo'),fin:innerHeight+scrollY>=document.documentElement.scrollHeight-4}},{passive:true});
F.addEventListener('touchend',e=>{if(!T)return;const t=e.changedTouches[0],dx=t.clientX-T.x,dy=t.clientY-T.y,ms=Date.now()-T.t,s0=T;T=null;
  if(ms>900)return;
  if(Math.abs(dx)>60&&Math.abs(dx)>1.6*Math.abs(dy)){ir(dx<0?1:-1);return}
  if(dy<-70&&Math.abs(dy)>1.6*Math.abs(dx)&&(s0.foto||s0.fin))salir()},{passive:true});

// En computadora: arrastrar con el mouse o deslizar dos dedos en el trackpad.
let M=null;
F.addEventListener('pointerdown',e=>{if(e.pointerType!='mouse'||e.button!==0||e.target.closest('a,button'))return;M={x:e.clientX,y:e.clientY,t:Date.now()}});
addEventListener('pointerup',e=>{if(!M)return;const dx=e.clientX-M.x,dy=e.clientY-M.y,ms=Date.now()-M.t;M=null;
  if(ms<900&&Math.abs(dx)>80&&Math.abs(dx)>2*Math.abs(dy)&&!String(getSelection()).trim())ir(dx<0?1:-1)});
F.addEventListener('dragstart',e=>e.preventDefault());
let acum=0,quieto=null,usado=false;
addEventListener('wheel',e=>{
  if(Math.abs(e.deltaX)<=Math.abs(e.deltaY))return;
  e.preventDefault();
  clearTimeout(quieto);quieto=setTimeout(()=>{acum=0;usado=false},250);
  if(usado)return;
  acum+=e.deltaX;
  if(Math.abs(acum)>110){usado=true;ir(acum>0?1:-1)}
},{passive:false});
</script>
</body>
</html>
